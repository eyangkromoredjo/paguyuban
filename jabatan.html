<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengguna Sistem - Paguyuban Kromoredjo</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    /* Custom styles for this page */
    .user-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }
    .user-table th, .user-table td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.85rem;
    }
    .user-table th {
      font-family: 'Outfit', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #f8fafc;
    }
    .user-table .level-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .level-admin { background: #ffebee; color: #c62828; }
    .level-pengurus { background: var(--primary-light); color: var(--primary-dark); }
    .level-anggota { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>

<main class="konten-utama" style="margin-left:0;">
  <div class="topbar">
    <div class="topbar-inner">
      <div style="display:flex; align-items:center;">
        <button class="btn-back" onclick="history.back()">❮</button>
      </div>
      <p class="topbar-judul">Pengguna Sistem</p>
      <div style="display:flex; align-items:center; gap:12px;">
        <p class="topbar-user" id="topbar-user" style="text-align:right; margin:0; line-height:1.2; font-size:0.75rem;"></p>
        <button id="btn-keluar" title="Keluar" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; width:34px; height:34px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.1rem; transition:0.2s;">🚪</button>
      </div>
    </div>
  </div>

  <div style="padding: 1.5rem;">
    <div class="panel aktif">
      <div class="panel-header">
        <h2 class="panel-judul">Daftar <em>Anggota Aktif</em></h2>
        <button class="btn-tambah" id="btn-tambah-jabatan">+ Atur Jabatan</button>
      </div>
      <p style="font-size: .85rem; color: var(--text-mid); margin-top: -1rem; margin-bottom: 1.5rem;">
        Daftar anggota mengikuti kandidat aktif di modul Arisan. Status login ditampilkan terpisah.
      </p>
      <div class="table-wrapper" style="border-radius: 14px; overflow-x: auto;">
        <table class="user-table" style="min-width: 600px;">
          <thead>
            <tr>
              <th>Nama Lengkap</th>
              <th>Username</th>
              <th>Akses Login</th>
              <th>Jabatan</th>
              <th style="text-align: center;">Aksi</th>
            </tr>
          </thead>
          <tbody id="user-list-body">
            <!-- Data will be rendered here by JavaScript -->
            <tr><td colspan="5" class="kosong-info">Memuat data pengguna...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- MODAL TAMBAH/EDIT JABATAN -->
<div class="modal-overlay" id="modal-jabatan">
  <div class="modal-box" style="max-width:450px">
    <div class="modal-header">
      <p class="modal-judul" id="modal-jabatan-judul">Tambah Jabatan</p>
      <button class="modal-tutup" data-close-modal="modal-jabatan">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nama Anggota</label>
        <select id="jabatan-select-anggota" class="search-box" style="width:100%; background: var(--bg); border-color: var(--border); color: var(--text-dark); padding:0.8rem">
          <option value="">-- Pilih Anggota --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Jabatan</label>
        <select id="jabatan-select-posisi" class="search-box" style="width:100%; background: var(--bg); border-color: var(--border); color: var(--text-dark); padding:0.8rem">
          <!-- Options will be generated by JS -->
        </select>
      </div>
      <fieldset class="form-group" style="border:0; padding:0; margin:0;">
        <legend style="font-size:.85rem; font-weight:600; margin-bottom:.5rem;">Urutan Jabatan (opsional)</legend>
        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:.4rem; cursor:pointer;">
            <input type="radio" name="jabatan-urutan" value="1"> Utama (1)
          </label>
          <label style="display:flex; align-items:center; gap:.4rem; cursor:pointer;">
            <input type="radio" name="jabatan-urutan" value="2"> Wakil (2)
          </label>
        </div>
      </fieldset>
    </div>
    <div class="modal-footer">
      <button class="btn-batal" data-close-modal="modal-jabatan">Batal</button>
      <button class="btn-simpan" id="btn-simpan-jabatan">Simpan Jabatan</button>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './js/firebase-config.js';
  import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  function keluar() {
    sessionStorage.removeItem('kromoredjo_user');
    window.location.href = 'dashboard.html';
  };

  // Use DOMContentLoaded for faster script execution after the DOM is ready
  document.addEventListener('DOMContentLoaded', () => {
    const savedUser = sessionStorage.getItem('kromoredjo_user');
    if (!savedUser) {
      window.location.href = 'dashboard.html';
      return;
    }
    
    const user = JSON.parse(savedUser);
    window.penggunaLogin = user;
    const levelMap = { admin: '👑 Admin', pengurus: '🛡️ Pengurus', anggota: '🔑 Anggota' };
    const roleText = levelMap[user.level] || user.level;
    document.getElementById('topbar-user').innerHTML = `${roleText}<br>${user.username}`;

    // Sembunyikan tombol "Atur Jabatan" jika bukan admin
    if (user.level !== 'admin') {
      document.getElementById('btn-tambah-jabatan').style.display = 'none';
    }

    // --- EVENT LISTENERS (The robust way) ---
    document.getElementById('btn-tambah-jabatan').addEventListener('click', () => bukaModalJabatan());
    document.getElementById('btn-simpan-jabatan').addEventListener('click', simpanJabatan);
    document.getElementById('btn-keluar').addEventListener('click', keluar);

    // Generic listener for all modal close buttons
    document.querySelectorAll('[data-close-modal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const modalId = btn.getAttribute('data-close-modal');
        tutupModal(modalId);
      });
    });

    // Event delegation for dynamically created "Edit" buttons
    document.getElementById('user-list-body').addEventListener('click', (event) => {
      if (event.target.classList.contains('btn-edit-jabatan')) {
        const userId = event.target.dataset.userId;
        bukaModalJabatan(userId);
      }
    });

    renderUserList();
  });

  function bukaModal(id) { document.getElementById(id)?.classList.add('aktif'); }
  function tutupModal(id) { document.getElementById(id)?.classList.remove('aktif'); }

  // --- START: JABATAN MANAGEMENT ---

  const JABATAN_LIST = [
    { group: "Struktur Inti", roles: ["Penasihat", "Ketua Paguyuban", "Wakil Ketua", "Sekretaris", "Bendahara"] },
    { group: "Seksi / Divisi", roles: ["Seksi Rohani", "Seksi Humas", "Seksi Acara", "Seksi Konsumsi", "Seksi Dana & Sosial", "Seksi Dokumentasi"] },
    { group: "Koordinator", roles: ["Koordinator Wilayah", "Perwakilan Generasi"] }
  ];

  function generateJabatanOptions(selectedValue = "") {
    let optionsHtml = `<option value="">-- Hapus Jabatan --</option>`;
    JABATAN_LIST.forEach(cat => {
      optionsHtml += `<optgroup label="${cat.group}">`;
      cat.roles.forEach(role => {
        optionsHtml += `<option value="${role}" ${selectedValue === role ? 'selected' : ''}>${role}</option>`;
      });
      optionsHtml += `</optgroup>`;
    });
    return optionsHtml;
  }

    function getKandidatArisan(allMembers) {
      const candidates = [];
      const processedIds = new Set();
      const candidateIds = new Set();
      const addCandidate = member => {
        const id = String(member.id);
        if (!candidateIds.has(id)) {
          candidates.push(member);
          candidateIds.add(id);
        }
      };
      const isTrah = member => !(member.spouseId || member.idPasangan) ||
        (member.parentId || member.idOrangTua || String(member.generasi) === '0');

      for (const member of allMembers) {
        const memberId = String(member.id);
        if (member.id === undefined || member.id === null || processedIds.has(memberId) || member.status !== 'aktif') continue;

        const spouseId = member.spouseId || member.idPasangan;
        let spouse = spouseId ? allMembers.find(item => String(item.id) === String(spouseId)) : null;
        if (!spouse) {
          spouse = allMembers.find(item =>
            String(item.id) !== memberId &&
            String(item.spouseId || item.idPasangan) === memberId
          );
        }

        if (spouse && String(spouse.id) !== memberId) {
          const spouseKey = String(spouse.id);
          if (processedIds.has(spouseKey)) {
            processedIds.add(memberId);
            continue;
          }

          const trahMember = isTrah(member) ? member : (isTrah(spouse) ? spouse : member);
          const nonTrahMember = String(trahMember.id) === memberId ? spouse : member;
          const representative = !trahMember.wafat
            ? trahMember
            : (!nonTrahMember.wafat ? nonTrahMember : null);
          if (representative) addCandidate(representative);
          processedIds.add(memberId);
          processedIds.add(spouseKey);
        } else {
          if (!member.wafat) addCandidate(member);
          processedIds.add(memberId);
        }
      }

      return candidates;
    }

  async function bukaModalJabatan(userId = null) {
      const judul = document.getElementById('modal-jabatan-judul');
      const selectAnggota = document.getElementById('jabatan-select-anggota');
      const selectPosisi = document.getElementById('jabatan-select-posisi');
      document.querySelectorAll('input[name="jabatan-urutan"]').forEach(radio => { radio.checked = false; });

      // Reset form
      selectAnggota.innerHTML = '<option value="">-- Memuat... --</option>';
      selectPosisi.innerHTML = generateJabatanOptions();
      
      const snapshot = await get(ref(db, "anggota"));
      if (!snapshot.exists()) return;
        const allMembers = Object.values(snapshot.val()).map(member => ({
          ...member,
          wafat: member.kehidupan === 'wafat'
        }));
        const kandidat = getKandidatArisan(allMembers);

        if (userId && !kandidat.some(member => String(member.id) === String(userId))) {
          const currentMember = allMembers.find(member => String(member.id) === String(userId));
          if (currentMember) kandidat.push(currentMember);
        }

      // Populate member dropdown
      selectAnggota.innerHTML = '<option value="">-- Pilih Anggota --</option>';
        kandidat.sort((a, b) => (a.nama || '').localeCompare(b.nama || '', 'id-ID'))
        .forEach(k => {
          const option = document.createElement('option');
          option.value = k.id;
          option.textContent = `${k.nama || 'Tanpa nama'}${k.ikutArisan ? ' ✦' : ''}`;
          if (k.ikutArisan) {
            option.style.color = '#81c784';
            option.style.fontWeight = 'bold';
          }
          selectAnggota.appendChild(option);
      });

      if (userId) {
          judul.textContent = 'Edit Jabatan Anggota';
          const user = allMembers.find(u => String(u.id) === String(userId));
          if (user) {
              selectAnggota.value = user.id;
              const roleMatch = (user.jabatan || '').match(/^(.*)\s+([12])$/);
              const baseRole = roleMatch ? roleMatch[1] : (user.jabatan || "");
              selectPosisi.innerHTML = generateJabatanOptions(baseRole);
              if (roleMatch) {
                const roleRadio = document.querySelector(`input[name="jabatan-urutan"][value="${roleMatch[2]}"]`);
                if (roleRadio) roleRadio.checked = true;
              }
              selectAnggota.disabled = true;
          }
      } else {
          judul.textContent = 'Atur Jabatan Baru';
          selectAnggota.disabled = false;
      }

      bukaModal('modal-jabatan');
  };

  async function simpanJabatan() {
      const userId = document.getElementById('jabatan-select-anggota').value;
      const baseJabatan = document.getElementById('jabatan-select-posisi').value;
      const urutan = document.querySelector('input[name="jabatan-urutan"]:checked')?.value || '';
      const jabatanBaru = baseJabatan ? `${baseJabatan}${urutan ? ` ${urutan}` : ''}` : '';

      if (!userId) {
          alert("Silakan pilih anggota terlebih dahulu.");
          return;
      }

      const snapshot = await get(ref(db, `anggota/${userId}`));
      if (!snapshot.exists()) return alert("Data anggota tidak ditemukan.");

      const user = snapshot.val();

      if (jabatanBaru) {
          const allMembersSnapshot = await get(ref(db, 'anggota'));
          const allMembers = allMembersSnapshot.exists() ? Object.values(allMembersSnapshot.val()) : [];
          const parseJabatan = (value) => {
            const match = String(value || '').trim().match(/^(.*?)\s*(\d+)?$/);
            return {
              base: (match?.[1] || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('id-ID'),
              slot: match?.[2] || ''
            };
          };
          const requested = parseJabatan(jabatanBaru);
          const conflict = allMembers.find(member => {
            if (String(member.id) === String(userId) || !member.jabatan) return false;
            const existing = parseJabatan(member.jabatan);
            if (!existing.base || existing.base !== requested.base) return false;
            // Jabatan tanpa nomor berbenturan dengan semua slot; nomor 1 dan 2
            // boleh dipakai bersama, tetapi slot bernomor yang sama tidak boleh dobel.
            return !existing.slot || !requested.slot || existing.slot === requested.slot;
          });

          if (conflict) {
            alert(`Jabatan "${jabatanBaru}" tidak dapat disimpan karena sudah digunakan oleh ${conflict.nama || 'anggota lain'} sebagai "${conflict.jabatan}".`);
            return;
          }
        }

      user.jabatan = jabatanBaru;
      if (user.level !== 'admin') user.level = jabatanBaru ? 'pengurus' : 'anggota';

      await set(ref(db, `anggota/${userId}`), user);
      alert("Jabatan berhasil disimpan.");
      tutupModal('modal-jabatan');
      renderUserList();
  };

  async function renderUserList() {
    const userListBody = document.getElementById('user-list-body');
    if (!userListBody) return;

    try {
      const snapshot = await get(ref(db, "anggota"));
      if (!snapshot.exists()) {
        userListBody.innerHTML = '<tr><td colspan="5" class="kosong-info">Tidak ada data anggota.</td></tr>';
        return;
      }

      const allMembers = Object.values(snapshot.val()).map(member => ({
        ...member,
        wafat: member.kehidupan === 'wafat'
      }));
      const isAdmin = window.penggunaLogin?.level === 'admin';
      const loginUsers = getKandidatArisan(allMembers)
        .sort((a, b) => (a.nama || '').localeCompare(b.nama || '', 'id-ID'));

      if (loginUsers.length === 0) {
        userListBody.innerHTML = '<tr><td colspan="5" class="kosong-info">Belum ada anggota aktif yang memenuhi kriteria kandidat Arisan.</td></tr>';
        return;
      }

      let html = '';
      loginUsers.forEach(user => {
        const hasLoginAccess = user.bolehDaftar === true || user.level === 'admin';
        const level = user.level || 'anggota';
        const username = hasLoginAccess
          ? `@${user.panggilan ? user.panggilan.toLowerCase() : (user.nama || '').split(' ')[0].toLowerCase()}`
          : '-';
        const loginLabel = hasLoginAccess ? level : 'Belum ada akses';
        
        html += `
          <tr>
            <td><strong>${user.nama || '-'}</strong></td>
            <td><em>${username}</em></td>
            <td><span class="level-badge ${hasLoginAccess ? `level-${level}` : ''}">${loginLabel}</span></td>
            <td style="color: var(--primary); font-weight: 600;">${user.jabatan || '-'}</td>
            <td style="text-align: center;">
              ${isAdmin ? `<button class="btn-sm btn-edit-jabatan" data-user-id="${user.id}" style="font-size: 0.7rem; padding: 4px 10px;">✏ Edit</button>` : '-'}
            </td>
          </tr>
        `;
      });

      userListBody.innerHTML = html;

    } catch (error) {
      console.error("Gagal mengambil data pengguna:", error);
      userListBody.innerHTML = '<tr><td colspan="5" class="kosong-info">Terjadi kesalahan saat memuat data.</td></tr>';
    }
  }
</script>

</body>
</html>
