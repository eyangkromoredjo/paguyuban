<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paguyuban Keluarga Eyang Kromoredjo</title>
  <meta name="description" content="Situs resmi Paguyuban Keluarga Eyang Kromoredjo - Menjaga tali silaturahmi lintas generasi sejak 1981." />
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Paguyuban Keluarga Eyang Kromoredjo" />
  <meta property="og:description" content="Satu Darah, Satu Hati. Merawat silaturahmi dari Solo hingga Jakarta." />

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background-color: #f0f4f8;
      color: #1a1a2e;
      overflow-x: hidden;
    }

    /* ── INTRO LOGO ── */
    .intro-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #002a5e, #003d7a 55%, #0054a6);
      animation: splash-exit 4.2s ease forwards;
    }

    .intro-splash img {
      width: clamp(120px, 30vw, 190px);
      aspect-ratio: 1;
      object-fit: cover;
      border: 3px solid rgba(245, 166, 35, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 0 10px rgba(245, 166, 35, 0.12), 0 0 45px rgba(245, 166, 35, 0.35);
      opacity: 0;
      animation: intro-logo-in 1.8s ease 0.1s forwards;
    }

    @keyframes intro-logo-in {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes splash-exit {
      0%, 58% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-splash { animation-duration: 1ms; }
      .intro-splash img { animation-duration: 1ms; animation-delay: 0ms; }
    }
  </style>
</head>
<body>

  <div class="intro-splash" aria-hidden="true">
    <img src="logo PKEK.jpg" alt="">
  </div>

  <script>
    // Redirect ke dashboard setelah animasi logo selesai (4.2 detik)
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 4200);
  </script>
</body>
</html>
